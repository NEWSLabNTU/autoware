launch:
- include:
    file: "$(find-pkg-share autoware_launch)/launch/autoware.launch.xml"
    arg:
    -
      name: vehicle_model
      value: sample_vehicle
    -
      name: sensor_model
      value: sample_sensor_kit
    -
      name: map_path
      value: ./data/COSS-map-planning
    -
      name: data_path
      value: ./data/artifacts
    -
      name: launch_localization
      value: "false"
    -
      name: pose_source
      value: "eagleye"
    -
      name: launch_map
      value: "false"
