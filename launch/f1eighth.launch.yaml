launch:
- include:
    file: "$(find-pkg-share autoware_launch)/launch/autoware.launch.xml"
    arg:
    -
      name: vehicle_model
      value: bus_vehicle
        # value: sample_vehicle
    -
      name: sensor_model
      value: sample_sensor_kit
    -
      name: map_path
      value: ./data/map
    -
      name: data_path
      value: ./data/artifacts
    -
      name: use_traffic_light_recognition
      value: "false"
    -
      name: use_sim_time
      value: "false"
    -
      name: stop_check_enabled
      value: "false"
    -
      name: launch_vehicle
      value: "true"
    -
      name: launch_system
      value: "true"
    -
      name: launch_map
      value: "true"
    -
      name: launch_sensing
      value: "true"
    -
      name: launch_sensing_driver
      value: "true"
    -
      name: launch_localization
      value: "true"
    -
      name: launch_perception
      value: "false"
    -
      name: launch_planning
      value: "true"
    -
      name: launch_control
      value: "true"
    -
      name: launch_sensing_driver
      value: "true"
    -
      name: pose_source
      value: ndt
    -
      name: twist_source
      value: gyro_odom
    -
      name: lidar_container_name
      value: /pointcloud_container
